name: Build installers and release packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/stamp_version.py "$GITHUB_REF_NAME"
      - run: cargo build --release --locked
      - name: Integration tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=.exe; else suffix=; fi
          python scripts/integration.py --binary "target/release/fluxget$suffix"
          python scripts/test_picker.py --binary "target/release/fluxget$suffix"
      - run: python scripts/package.py
      - name: Installer tests
        run: python scripts/test_installers.py
      - uses: actions/upload-artifact@v7
        with:
          name: fluxget-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: fluxget-*
          path: dist
          merge-multiple: true
      - name: Publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Fluxget $GITHUB_REF_NAME" --generate-notes

