name: Build installers and release packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python scripts/stamp_version.py "$GITHUB_REF_NAME"
      - run: cargo build --release --locked
      - name: Integration tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=.exe; else suffix=; fi
          python scripts/integration.py --binary "target/release/fluxget$suffix"
          python scripts/test_picker.py --binary "target/release/fluxget$suffix"
      - run: python scripts/package.py
      - name: Installer tests
        run: python scripts/test_installers.py
      - uses: actions/upload-artifact@v7
        with:
          name: fluxget-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: fluxget-*
          path: dist
          merge-multiple: true
      - name: Publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Fluxget $GITHUB_REF_NAME" --generate-notes

  update-readme:
    # Opens a pull request that puts the new version, download links and SHA-256 values in the
    # README's release block. Needs "Allow GitHub Actions to create and approve pull requests"
    # (Settings > Actions > General). Pull requests opened with the default token do not start
    # the CI workflow; add a fine-grained token with contents and pull-requests write access as
    # RELEASE_README_TOKEN to have CI run on them too.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v8
        with:
          pattern: fluxget-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Update README release block
        run: python scripts/update_readme_release.py --version "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_README_TOKEN || github.token }}
          branch: chore/readme-${{ github.ref_name }}
          delete-branch: true
          add-paths: README.md
          commit-message: "docs: update README for fluxget ${{ github.ref_name }}"
          title: "docs: update README for fluxget ${{ github.ref_name }}"
          body: |
            Automated by the release workflow after publishing [fluxget ${{ github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}).

            Updates the version, download links and SHA-256 checksums in the README's release block. Nothing else changes.
